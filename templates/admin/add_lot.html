{% extends 'admin/admin_base.html' %}
{% block pg_title %}Add Lot{% endblock %}
{% block admin_main %}
<h1 class="h2">Create New Lot</h1>
<form method="POST" class="mt-4">
    <div class="form-group"><label>Location Name</label><input type="text" name="name" class="form-control" required></div>
    <div class="form-group"><label>Address</label><input type="text" name="addr" class="form-control" required></div>
    <div class="form-group"><label>Pincode</label><input type="text" name="pin" class="form-control" required></div>
    <div class="form-group"><label>Capacity</label><input type="number" name="cap" class="form-control" required min="1"></div>
    <div class="form-group"><label>Price Per Hour ($)</label><input type="number" name="cost" class="form-control" required step="0.01" min="0"></div>
    <button type="submit" class="btn btn-primary">Create</button>
    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
