{% extends 'admin/admin_base.html' %}
{% block pg_title %}Edit Lot{% endblock %}
{% block admin_main %}
<h1 class="h2">Edit {{ lot.location_name }}</h1>
<form method="POST" class="mt-4">
    <div class="form-group"><label>Location Name</label><input type="text" name="name" class="form-control" value="{{ lot.location_name }}" required></div>
    <div class="form-group"><label>Address</label><input type="text" name="addr" class="form-control" value="{{ lot.address }}" required></div>
    <div class="form-group"><label>Pincode</label><input type="text" name="pin" class="form-control" value="{{ lot.pin_code }}" required></div>
    <div class="form-group"><label>Capacity</label><input type="number" name="cap" class="form-control" value="{{ lot.max_spots }}" required min="1"></div>
    <div class="form-group"><label>Price Per Hour ($)</label><input type="number" name="cost" class="form-control" value="{{ lot.price_per_hour }}" required step="0.01" min="0"></div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
